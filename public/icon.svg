<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002452"/>
      <stop offset="100%" stop-color="#1B3A6B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EC8C8"/>
      <stop offset="100%" stop-color="#008B8B"/>
    </linearGradient>
  </defs>
  <!-- Background with slight rounding -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Network / Hub Graphic Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-dasharray="14 10" opacity="0.35"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.2"/>

  <!-- Satellite / Antenna Nodes -->
  <circle cx="256" cy="170" r="26" fill="url(#accentGrad)"/>
  <circle cx="180" cy="300" r="22" fill="#FFFFFF"/>
  <circle cx="332" cy="300" r="22" fill="#FFFFFF"/>
  <path d="M256 170 L180 300 M256 170 L332 300 M180 300 L332 300" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="256" cy="256" r="14" fill="url(#accentGrad)"/>
  
  <!-- Text Emblem ON' -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ON'KONNECT</text>
  <text x="256" y="450" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#3EC8C8" text-anchor="middle" letter-spacing="4">MANAGER</text>
</svg>
